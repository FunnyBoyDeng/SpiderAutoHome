name: Verify SpiderAutoHome

on:
  push:
    branches:
      - master
      - modernize/dotnet10-spiderautohome
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show SDK
        run: dotnet --info

      - name: Restore SpiderAutoHome
        run: dotnet restore SpiderAutoHome/SpiderAutoHome.csproj

      - name: Build SpiderAutoHome
        run: dotnet build SpiderAutoHome/SpiderAutoHome.csproj --no-restore --configuration Release

      - name: Restore tests
        run: dotnet restore SpiderAutoHome.Tests/SpiderAutoHome.Tests.csproj

      - name: Run tests
        run: dotnet run --project SpiderAutoHome.Tests/SpiderAutoHome.Tests.csproj --configuration Release --no-restore
